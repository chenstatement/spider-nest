        // ==================== 蜘蛛网络Canvas ====================
        const canvas = document.getElementById('spider-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null };
        let hoveredSpider = null;
        let isWeaving = false;
        
        // 初始化Canvas
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        // 粒子类
        class Particle {
            constructor(isStyleSpider = false, spiderData = null) {
                this.isStyleSpider = isStyleSpider;
                this.spiderData = spiderData;
                
                if (isStyleSpider && spiderData) {
                    // 风格蜘蛛：分布在屏幕周围，相对固定位置
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.min(width, height) * 0.35;
                    this.x = width / 2 + Math.cos(angle) * radius;
                    this.y = height / 2 + Math.sin(angle) * radius;
                    this.baseX = this.x;
                    this.baseY = this.y;
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2;
                    this.size = 4 * spiderData.size;
                    this.color = spiderData.color;
                    this.glowColor = spiderData.glowColor;
                } else {
                    // 普通蜘蛛：随机分布
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    this.size = 2 + Math.random() * 2;
                    this.color = '#FFD700';
                    this.glowColor = 'rgba(255, 215, 0, 0.3)';
                }
                
                this.brightness = Math.random() * 0.4 + 0.4;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                if (isWeaving) {
                    // 结网时向中心聚集
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const dx = centerX - this.x;
                    const dy = centerY - this.y;
                    this.vx += dx * 0.0003;
                    this.vy += dy * 0.0003;
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                } else if (this.isStyleSpider) {
                    // 风格蜘蛛：在基位置附近缓慢巡游
                    this.vx += (this.baseX - this.x) * 0.001;
                    this.vy += (this.baseY - this.y) * 0.001;
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                }
                
                this.x += this.vx;
                this.y += this.vy;
                
                // 边界处理
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                // 脉冲动画
                this.pulsePhase += 0.02;
            }
            
            draw() {
                const pulse = Math.sin(this.pulsePhase) * 0.2 + 0.8;
                
                // 光晕
                const glowSize = this.isStyleSpider ? 3 : 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * glowSize * pulse, 0, Math.PI * 2);
                ctx.fillStyle = this.glowColor;
                ctx.fill();
                
                // 核心
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * pulse, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 风格蜘蛛额外效果
                if (this.isStyleSpider && this.spiderData) {
                    this.drawEffect();
                }
            }
            
            drawEffect() {
                const effect = this.spiderData.effect;
                
                if (effect === 'stardust') {
                    // 星尘效果
                    for (let i = 0; i < 3; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = this.size * 3 + Math.random() * 10;
                        ctx.beginPath();
                        ctx.arc(
                            this.x + Math.cos(angle) * dist,
                            this.y + Math.sin(angle) * dist,
                            1,
                            0, Math.PI * 2
                        );
                        ctx.fillStyle = `rgba(192, 192, 192, ${Math.random() * 0.5})`;
                        ctx.fill();
                    }
                } else if (effect === 'rainbow') {
                    // 彩虹闪烁
                    const hue = (Date.now() / 10) % 360;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${hue}, 70%, 50%, 0.3)`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (effect === 'glitch') {
                    // 故障效果
                    if (Math.random() > 0.7) {
                        ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
                        ctx.fillRect(this.x - this.size, this.y - 2, this.size * 2, 4);
                    }
                } else if (effect === 'cloud') {
                    // 祥云效果
                    ctx.beginPath();
                    ctx.arc(this.x - 5, this.y - 5, 3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(220, 38, 38, 0.2)';
                    ctx.fill();
                } else if (effect === 'fire') {
                    // 火焰效果
                    if (Math.random() > 0.8) {
                        ctx.font = '12px Arial';
                        ctx.fillStyle = 'rgba(249, 115, 22, 0.6)';
                        ctx.fillText('🔥', this.x + 10, this.y - 10);
                    }
                }
            }
            
            isHovered(mx, my) {
                const dx = this.x - mx;
                const dy = this.y - my;
                return Math.sqrt(dx * dx + dy * dy) < this.size * 3;
            }
        }
        
        // 初始化粒子
        function initParticles() {
            particles = [];
            
            // 创建40个普通蜘蛛
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(false));
            }
            
            // 创建12个风格蜘蛛
            STYLE_SPIDERS.forEach(spiderData => {
                particles.push(new Particle(true, spiderData));
            });
        }
        
        // 绘制连线
        function drawConnections() {
            // 普通蜘蛛连线（细、淡）
            for (let i = 0; i < particles.length; i++) {
                if (particles[i].isStyleSpider) continue;
                
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[j].isStyleSpider) continue;
                    
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const opacity = (1 - dist / 100) * 0.15;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 215, 0, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            
            // 风格蜘蛛连线（粗、亮、特殊）
            const styleSpiders = particles.filter(p => p.isStyleSpider);
            for (let i = 0; i < styleSpiders.length; i++) {
                for (let j = i + 1; j < styleSpiders.length; j++) {
                    const dx = styleSpiders[i].x - styleSpiders[j].x;
                    const dy = styleSpiders[i].y - styleSpiders[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 200) {
                        const opacity = (1 - dist / 200) * 0.4;
                        ctx.beginPath();
                        ctx.moveTo(styleSpiders[i].x, styleSpiders[i].y);
                        ctx.lineTo(styleSpiders[j].x, styleSpiders[j].y);
                        ctx.strokeStyle = `rgba(255, 215, 0, ${opacity})`;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
            }
            
            // 鼠标连线
            if (mouse.x && mouse.y) {
                particles.forEach(p => {
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 150) {
                        const opacity = (1 - dist / 150) * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.strokeStyle = p.isStyleSpider ? 
                            p.glowColor.replace(/[\d.]+\)$/, `${opacity})`) :
                            `rgba(255, 215, 0, ${opacity})`;
                        ctx.lineWidth = p.isStyleSpider ? 1.5 : 0.8;
                        ctx.stroke();
                    }
                });
            }
        }
        
        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // 绘制连线
            drawConnections();
            
            // 先画普通蜘蛛
            particles.filter(p => !p.isStyleSpider).forEach(p => {
                p.update();
                p.draw();
            });
            
            // 再画风格蜘蛛（在上面）
            particles.filter(p => p.isStyleSpider).forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        // 鼠标事件
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            // 检查悬停
            const styleSpiders = particles.filter(p => p.isStyleSpider);
            let found = null;
            
            for (let spider of styleSpiders) {
                if (spider.isHovered(mouse.x, mouse.y)) {
                    found = spider;
                    break;
                }
            }
            
            if (found !== hoveredSpider) {
                hoveredSpider = found;
                if (found) {
                    showSpiderCard(found.spiderData, found.x, found.y);
                } else {
                    hideSpiderCard();
                }
            }
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
            hoveredSpider = null;
            hideSpiderCard();
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            initCanvas();
            initParticles();
        });
        
        // 初始化
        initCanvas();
        initParticles();
        animate();
        
        // ==================== 蜘蛛信息卡片 ====================
        const spiderCard = document.getElementById('spiderCard');
        
        function showSpiderCard(data, x, y) {
            document.getElementById('cardIcon').textContent = data.icon;
            document.getElementById('cardName').textContent = data.name;
            document.getElementById('cardName').style.color = data.color;
            document.getElementById('cardDomain').textContent = data.domain;
            document.getElementById('cardDesc').textContent = data.desc;
            document.getElementById('cardPrice').textContent = data.price;
            document.getElementById('cardSuccess').textContent = data.success;
            document.getElementById('cardRating').textContent = data.rating;
            
            const tagsContainer = document.getElementById('cardTags');
            tagsContainer.innerHTML = '';
            data.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'spider-card-tag';
                span.textContent = tag;
                tagsContainer.appendChild(span);
            });
            
            // 定位卡片
            const cardWidth = 280;
            const cardHeight = 200;
            let cardX = x + 20;
            let cardY = y + 20;
            
            if (cardX + cardWidth > width) cardX = x - cardWidth - 20;
            if (cardY + cardHeight > height) cardY = y - cardHeight - 20;
            
            spiderCard.style.left = cardX + 'px';
            spiderCard.style.top = cardY + 'px';
            spiderCard.classList.add('show');
        }
        
        function hideSpiderCard() {
            spiderCard.classList.remove('show');
        }
        
        // ==================== 结网动画 ====================
        const weavingOverlay = document.getElementById('weavingOverlay');
        const weavingCanvas = document.getElementById('weavingCanvas');
        const weavingCtx = weavingCanvas.getContext('2d');
        let weavingAnimationId = null;
        
        function startWeavingAnimation() {
            weavingOverlay.classList.add('show');
            isWeaving = true;
            
            const centerX = 200;
            const centerY = 200;
            const maxRadius = 180;
            let progress = 0;
            
            function drawWeaving() {
                weavingCtx.clearRect(0, 0, 400, 400);
                
                progress += 0.01;
                if (progress > 1) progress = 1;
                
                // 绘制同心圆（网）
                for (let i = 1; i <= 8; i++) {
                    const radius = (maxRadius / 8) * i * progress;
                    weavingCtx.beginPath();
                    weavingCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    weavingCtx.strokeStyle = `rgba(255, 215, 0, ${0.3 * progress})`;
                    weavingCtx.lineWidth = 1;
                    weavingCtx.stroke();
                }
                
                // 绘制放射线
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    weavingCtx.beginPath();
                    weavingCtx.moveTo(centerX, centerY);
                    weavingCtx.lineTo(
                        centerX + Math.cos(angle) * maxRadius * progress,
                        centerY + Math.sin(angle) * maxRadius * progress
                    );
                    weavingCtx.strokeStyle = `rgba(255, 215, 0, ${0.4 * progress})`;
                    weavingCtx.lineWidth = 1;
                    weavingCtx.stroke();
                }
                
                // 中心发光
                const glowRadius = 30 + Math.sin(progress * Math.PI * 4) * 10;
                const gradient = weavingCtx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, glowRadius
                );
                gradient.addColorStop(0, `rgba(255, 215, 0, ${0.8 * progress})`);
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                weavingCtx.fillStyle = gradient;
                weavingCtx.fillRect(0, 0, 400, 400);
                
                if (progress < 1) {
                    weavingAnimationId = requestAnimationFrame(drawWeaving);
                }
            }
            
            drawWeaving();
        }
        
        function stopWeavingAnimation() {
            weavingOverlay.classList.remove('show');
            isWeaving = false;
            if (weavingAnimationId) {
                cancelAnimationFrame(weavingAnimationId);
            }
        }
        
        // ==================== 业务逻辑 ====================
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultSection = document.getElementById('resultSection');
        const resultContent = document.getElementById('resultContent');
        
        function setPrompt(prompt) {
            promptInput.value = prompt;
            promptInput.focus();
        }
        
        async function generate() {
            const prompt = promptInput.value.trim();
            
            if (!prompt) {
                promptInput.focus();
                return;
            }
            
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span>结网中...</span>';
            
            resultSection.classList.remove('show');
            
            startWeavingAnimation();
            
            // 模拟API调用
            await new Promise(resolve => setTimeout(resolve, 2500));
            
            stopWeavingAnimation();
            
            // 模拟结果
            const result = `根据您的需求：「${prompt}」

我已为您生成以下内容：

这是一个示例结果，展示了因子蜘蛛的生成能力。在实际部署中，这里会接入真实的AI API，根据您的输入生成高质量的内容。

生成的内容类型包括：
• 文章、故事、诗歌
• 代码、脚本、算法
• 设计方案、创意构思
• 数据分析、报告
• 计划、大纲、策略

请继续输入您的需求，体验完整的生成能力。`;
            
            resultContent.textContent = result;
            resultSection.classList.add('show');
            
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<span>生成</span>';
        }
        
        function copyResult() {
            const text = resultContent.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                btn.textContent = '✓ 已复制';
                setTimeout(() => btn.textContent = '📋 复制', 2000);
            });
        }
        
        function regenerate() {
            generate();
        }
        
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generate();
        });
        
        // placeholder动画
        const placeholders = [
            '我想写一首关于秋天的诗...',
            '帮我写一段Python爬虫代码...',
            '设计一个科技公司的Logo...',
            '分析这份销售数据...',
            '制定一个30天健身计划...'
        ];
        
        let placeholderIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        
        function typePlaceholder() {
            const current = placeholders[placeholderIndex];
            
            if (isDeleting) {
                promptInput.setAttribute('placeholder', current.substring(0, charIndex - 1));
                charIndex--;
            } else {
                promptInput.setAttribute('placeholder', current.substring(0, charIndex + 1));
                charIndex++;
            }
            
            let typeSpeed = isDeleting ? 50 : 100;
            
            if (!isDeleting && charIndex === current.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                placeholderIndex = (placeholderIndex + 1) % placeholders.length;
                typeSpeed = 500;
            }
            
            setTimeout(typePlaceholder, typeSpeed);
        }
        
        typePlaceholder();
    </script>
</body>
